<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Loan Document Center
</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b71c1c">
</head>


<body>


<header>

<h1>
📂 Loan Document Center
</h1>

<h2>
ระบบจัดเก็บและดาวน์โหลดเอกสารสินเชื่อ
</h2>

<p>
Loan Document Management System
</p>

</header>



<section class="dashboard">


<div class="stat">
<span>📁</span>
<h3 id="allCount">0</h3>
<p>ไฟล์ทั้งหมด</p>
</div>


<div class="stat pdf-box">
<span>📕</span>
<h3 id="pdfCount">0</h3>
<p>PDF</p>
</div>


<div class="stat excel-box">
<span>📗</span>
<h3 id="excelCount">0</h3>
<p>Excel</p>
</div>

<div class="stat">
<span>👁️</span>
<h3 id="viewCount">0</h3>
<p>เข้าชม</p>
</div>

<div class="stat">
<span>⬇️</span>
<h3 id="downloadCount">0</h3>
<p>ดาวน์โหลด</p>
</div>

</section>




<div class="search">

<input 
id="search"
placeholder="🔍 ค้นหาเอกสาร..."
>

</div>




<section>

<h2 class="title">
📕 เอกสาร PDF
</h2>


<div 
id="pdfList"
class="grid">
</div>


</section>




<section>

<h2 class="title">
📗 เอกสาร Excel
</h2>


<div 
id="excelList"
class="grid">
</div>


</section>



<footer>

Team File Center | Internal Document System

</footer>




<script src="files-data.js"></script>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js");
}
</script>

</body>

</html>
